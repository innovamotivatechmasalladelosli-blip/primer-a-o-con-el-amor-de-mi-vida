<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre los Recuerdos 1 ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game" aria-label="Entre los Recuerdos, juego de plataformas pixel art"></canvas>
<div id="ui"></div>

<div id="touch-controls" aria-label="Controles táctiles">
  <div class="touch-cluster touch-cluster-left">
    <button id="btn-left" class="t-btn" aria-label="Mover a la izquierda">◄</button>
    <button id="btn-right" class="t-btn" aria-label="Mover a la derecha">►</button>
  </div>
  <div class="touch-cluster touch-cluster-right">
    <button id="btn-jump" class="t-btn" aria-label="Saltar">▲</button>
  </div>
</div>

<script src="js/engine.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
